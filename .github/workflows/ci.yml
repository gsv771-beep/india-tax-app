# The merge gate. Runs on every push and every pull request; a red run blocks merging to main
# once "test" is a required status check in the branch protection rule (docs/ENVIRONMENTS.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine, known-answer and fixture tests
        run: npm test
