# Rebuilds public/data/mf_returns.json from AMFI NAV history once a month and commits it to `dev`.
# Nothing commits straight to `main`: the refreshed data reaches production with the next
# dev -> main promotion (docs/ENVIRONMENTS.md). Run it by hand from the Actions tab with "Run workflow".
name: Update mutual fund returns

on:
  schedule:
    - cron: '0 3 2 * *'   # 03:00 UTC on the 2nd of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build fund returns dataset
        run: node tools/build-mf-returns.mjs --no-cache
      - name: Run tests
        run: npm test
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/mf_returns.json
          if git diff --cached --quiet; then
            echo "No change in fund data"
          else
            git commit -m "Update mutual fund returns data ($(date -u +%Y-%m-%d))"
            git push
          fi
